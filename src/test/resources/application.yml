spring:
  datasource:
    # NON_KEYWORDS: columnas "day"/"week" (library_program_item) son palabras reservadas en H2, no en PostgreSQL.
    url: jdbc:h2:mem:t;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=DAY,WEEK
    username: sa
    password:
  flyway:
    enabled: false          # en tests Hibernate crea el esquema; el SQL real se valida aparte
  jpa:
    hibernate:
      ddl-auto: create-drop
app:
  public-url: http://localhost:4200
  mail:
    provider: log
    from: Physical Change <noreply@test.local>
    support: soporte@test.local
  jwt:
    secret: test-secret-test-secret-test-secret-123456
    expiration-minutes: 10
  cors:
    allowed-origins: http://localhost:4200
  admin:
    email: admin
    password: admin
  rate-limit:
    enabled: false          # los límites por IP se prueban en RateLimitTest con valores bajos
  content:
    scheduler-enabled: false   # el job de publicación se invoca a mano en los tests (ContentPublishJob.runOnce)
    process-on-read: false
  # app.social.token-key: sin clave las redes quedan NOT_CONFIGURED; los tests que la necesitan la generan al arrancar
  # (@DynamicPropertySource con una clave aleatoria): nunca hay una clave en el repositorio.
