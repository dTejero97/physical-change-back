server:
  port: ${PORT:8080}
spring:
  data:
    web:
      pageable:
        max-page-size: 5000   # el catálogo de ejercicios (~2.100) se carga entero en Librería
  application:
    name: physical-change-back
  datasource:
    # En Render se usa DATABASE_URL (postgres://...). Ver DatabaseUrlEnvironmentPostProcessor.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/physicalchange}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration   # el esquema vive en src/main/resources/db/migration
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway crea las tablas; Hibernate solo comprueba que coincidan
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB      # ADR-001: límite por archivo (los vídeos van directos a R2, ADR-005)
      max-request-size: 11MB
app:
  public-url: ${PUBLIC_APP_URL:http://localhost:4200}   # URL del frontend para los enlaces de los correos (T137)
  mail:                                 # T137: proveedor tras una interfaz; ver MANUAL-DESPLIEGUE.md Parte 10
    provider: ${MAIL_PROVIDER:log}      # log = no envía, solo escribe en el log (desarrollo) | resend
    resend-api-key: ${RESEND_API_KEY:}  # secreto: solo en Render
    from: ${MAIL_FROM:Physical Change <noreply@phisicalchange.com>}
    support: ${MAIL_SUPPORT:soporte@phisicalchange.com}
  jwt:
    secret: ${JWT_SECRET}            # obligatorio, mínimo 32 caracteres
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  storage:
    type: ${STORAGE_TYPE:database}          # database (ADR-001) | r2 (Cloudflare R2, ADR-005)
    quota-mb: ${STORAGE_QUOTA_MB:}          # vacío = 50 MB con database, 2048 MB con r2
    global-max-mb: ${STORAGE_GLOBAL_MAX_MB:}   # tope de toda la plataforma; vacío = 9216 MB con r2 (plan gratuito: 10 GB), sin tope con database
    r2:
      account-id: ${R2_ACCOUNT_ID:}         # ID de cuenta de Cloudflare
      access-key-id: ${R2_ACCESS_KEY_ID:}   # secreto
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}   # secreto
      bucket: ${R2_BUCKET:}                 # p. ej. physical-change-files
      endpoint: ${R2_ENDPOINT:}             # vacío = https://<account-id>.r2.cloudflarestorage.com
  ai:                                       # Physical AI (ADR-003)
    provider: ${AI_PROVIDER:none}           # none (los endpoints responden 503) | workers-ai
    account-id: ${CF_ACCOUNT_ID:}           # vacío = R2_ACCOUNT_ID (misma cuenta de Cloudflare)
    api-token: ${CF_AI_API_TOKEN:}          # secreto: Workers AI Read + Edit
    model: ${AI_MODEL:@cf/meta/llama-3.3-70b-instruct-fp8-fast}
    monthly-credits: ${AI_MONTHLY_CREDITS:6}
    daily-neuron-budget: ${AI_DAILY_NEURON_BUDGET:9000}
    chat-daily-limit: ${AI_CHAT_DAILY_LIMIT:30}
    neurons-per-m-input: ${AI_NEURONS_PER_M_INPUT:26668}     # tabla de precios del modelo 70B (ADR-003)
    neurons-per-m-output: ${AI_NEURONS_PER_M_OUTPUT:204805}
  admin:
    email: ${ADMIN_USER:admin}          # usuario de acceso del administrador
    password: ${ADMIN_PASSWORD:admin}   # se aplica solo al crear el admin por primera vez
    reset-password: ${ADMIN_RESET_PASSWORD:}
  env: ${APP_ENV:dev}                  # prod en Render: exige ADMIN_PASSWORD fuerte (T141)
  rate-limit:                          # T141 (Nota de Seguridad T140): límites en memoria por IP y por usuario
    enabled: ${RATE_LIMIT_ENABLED:true}
    trust-proxy: true                  # IP real = última entrada de X-Forwarded-For (proxy de Render)
    login-per-ip-per-minute: 10
    login-failures-per-user: 5
    login-lock-minutes: 15
    public-per-ip-per-minute: 300
    api-per-ip-per-minute: 600   # si se define, fija la contraseña del admin en cada arranque (temporal)
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}      # en producción SWAGGER_ENABLED=false (Nota de Seguridad T140, Medio 2)
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
management:
  endpoints:
    web:
      exposure:
        include: health,info
