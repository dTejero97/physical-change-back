# Blueprint de Render: crea la base PostgreSQL y el servicio web (Docker) que la usa.
databases:
  - name: physical-change-db
    databaseName: physical_change
    user: physical_change
    plan: free

services:
  - type: web
    name: physical-change-back
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      # Render inyecta la URL de la base automáticamente (postgres://...)
      - key: DATABASE_URL
        fromDatabase:
          name: physical-change-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD        # pon aquí la contraseña del administrador
        sync: false
      - key: CORS_ALLOWED_ORIGINS  # URL de Vercel, p. ej. https://physical-change.vercel.app
        sync: false
