# Blueprint de Render para el backend.
# La base PostgreSQL NO se crea aquí: la cuenta gratuita admite una sola base activa,
# así que se reutiliza una existente y su URL se pega a mano en DATABASE_URL.
services:
  - type: web
    name: physical-change-back
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL          # postgres://usuario:clave@host/base (la copias de tu base en Render)
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD        # contraseña del administrador
        sync: false
      - key: CORS_ALLOWED_ORIGINS  # URL de Vercel, p. ej. https://physical-change.vercel.app
        sync: false
