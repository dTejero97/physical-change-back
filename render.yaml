# Blueprint de Render para el backend.
# La base PostgreSQL NO se crea aquí: la cuenta gratuita admite una sola base activa,
# así que se reutiliza una existente y su URL se pega a mano en DATABASE_URL.
services:
  - type: web
    name: physical-change-back
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL          # postgres://usuario:clave@host/base (la copias de tu base en Render)
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD        # contraseña del administrador
        sync: false
      - key: APP_ENV               # prod: el backend no arranca con una ADMIN_PASSWORD débil (T141)
        value: prod
      - key: SWAGGER_ENABLED       # false: sin /swagger-ui ni /v3/api-docs públicos en producción (T141)
        value: "false"
      - key: CORS_ALLOWED_ORIGINS  # URL de Vercel, p. ej. https://physical-change.vercel.app
        sync: false
      # ---- Archivos en Cloudflare R2 (ADR-005, MANUAL-DESPLIEGUE.md Parte 8) ----
      - key: STORAGE_TYPE          # vacío/database = PostgreSQL | r2 cuando las 4 de abajo estén rellenas
        sync: false
      - key: R2_ACCOUNT_ID         # ID de cuenta de Cloudflare (panel de R2 → Account Details)
        sync: false
      - key: R2_ACCESS_KEY_ID      # secreto: token de R2 "Object Read & Write" solo para el bucket
        sync: false
      - key: R2_SECRET_ACCESS_KEY  # secreto: solo se ve una vez al crear el token
        sync: false
      - key: R2_BUCKET             # p. ej. physical-change-files
        sync: false
      # ---- Physical AI con Cloudflare Workers AI (ADR-003, MANUAL-DESPLIEGUE.md Parte 9) ----
      - key: AI_PROVIDER           # vacío/none = Physical AI desactivado (503) | workers-ai cuando el token esté puesto
        sync: false
      - key: CF_ACCOUNT_ID         # vacío = se usa R2_ACCOUNT_ID (misma cuenta de Cloudflare)
        sync: false
      - key: CF_AI_API_TOKEN       # secreto: token "Workers AI" (Read + Edit), distinto del de R2
        sync: false
