services:
  - type: web
    name: physical-change-back
    runtime: docker
    healthCheckPath: /actuator/health
    envVars:
      - key: ORACLE_URL
        sync: false
      - key: ORACLE_USER
        sync: false
      - key: ORACLE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
